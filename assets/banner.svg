<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for glowing badges -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Styles -->
    <style>
      .bg-grid { stroke: rgba(255,255,255,0.03); stroke-width: 1; }
      .sound-bar {
        animation: pulseBar 1.8s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      @keyframes pulseBar {
        0% { transform: scaleY(0.25); opacity: 0.35; }
        50% { transform: scaleY(1.0); opacity: 0.85; }
        100% { transform: scaleY(0.45); opacity: 0.5; }
      }
      .orbit-dot {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0); }
        100% { transform: translate(30px, -20px); }
      }
      .orbit-dot-rev {
        animation: floatOrbRev 9s ease-in-out infinite alternate;
      }
      @keyframes floatOrbRev {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-25px, 25px); }
      }
      .tag-chip {
        animation: tagFloat 4s ease-in-out infinite alternate;
      }
      @keyframes tagFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Blobs in Background -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" class="orbit-dot" />
  <circle cx="1080" cy="280" r="200" fill="#ec4899" opacity="0.1" filter="url(#softGlow)" class="orbit-dot-rev" />
  <circle cx="600" cy="350" r="160" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)" />

  <!-- Technical Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Equalizer / Speech Waveforms in Background (Bottom Area) -->
  <g transform="translate(0, 240)">
    <!-- Audio Waveform Bars (Background dynamic accent) -->
    <rect class="sound-bar" x="50"  y="0" width="6" height="50" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.1s;" />
    <rect class="sound-bar" x="70"  y="0" width="6" height="75" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.4s;" />
    <rect class="sound-bar" x="90"  y="0" width="6" height="35" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.2s;" />
    <rect class="sound-bar" x="110" y="0" width="6" height="65" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.7s;" />
    <rect class="sound-bar" x="130" y="0" width="6" height="40" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.3s;" />

    <rect class="sound-bar" x="1050" y="0" width="6" height="45" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.5s;" />
    <rect class="sound-bar" x="1070" y="0" width="6" height="70" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.2s;" />
    <rect class="sound-bar" x="1090" y="0" width="6" height="30" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.8s;" />
    <rect class="sound-bar" x="1110" y="0" width="6" height="60" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.3s;" />
    <rect class="sound-bar" x="1130" y="0" width="6" height="40" rx="3" fill="url(#accentGrad)" style="animation-delay: 0.6s;" />
  </g>

  <!-- Flowing Audio Sine Wave Curves (Middle/Bottom Background) -->
  <path d="M 0 310 Q 150 270 300 305 T 600 295 T 900 315 T 1200 290 L 1200 360 L 0 360 Z" fill="url(#waveGrad)" />
  <path d="M 0 325 Q 200 295 400 325 T 800 310 T 1200 320" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />
  <path d="M 0 335 Q 250 310 500 335 T 1000 325 T 1200 335" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.3" />

  <!-- Floating Dynamic Tech Pills / Chips (Behind text layers, safely offset) -->
  <g class="tag-chip" style="animation-delay: 0s;">
    <rect x="80" y="45" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="95" cy="59" r="4" fill="#10b981" />
    <text x="108" y="64" fill="#94a3b8" font-size="12" font-weight="600">On-Device Whisper</text>
  </g>
  <g class="tag-chip" style="animation-delay: 1.5s;">
    <rect x="975" y="45" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="990" cy="59" r="4" fill="#6366f1" />
    <text x="1002" y="64" fill="#94a3b8" font-size="12" font-weight="600">Botless Loopback</text>
  </g>
  <g class="tag-chip" style="animation-delay: 2.2s;">
    <rect x="800" y="85" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="815" cy="99" r="4" fill="#f59e0b" />
    <text x="828" y="104" fill="#94a3b8" font-size="12" font-weight="600">Auto Diarization</text>
  </g>

  <!-- Central Foreground Content Container -->
  <!-- Top Badge Label -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#ec4899" />
    <text x="-98" y="5" fill="#c7d2fe" font-size="13" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="145" text-anchor="middle" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Awesome Meeting Intelligence &amp; AI Transcription
  </text>

  <!-- Foreground Subtitle / Tagline -->
  <text x="600" y="185" text-anchor="middle" font-size="18" font-weight="500" fill="#94a3b8">
    Top SaaS Platforms • On-Device Whisper Repos • Botless Loopbacks • Speech-to-Text APIs
  </text>

  <!-- Feature Metric Pills in Foreground -->
  <g transform="translate(600, 235)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(-250, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#1e2438" stroke="#374151" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">🏢 SaaS Platforms Analyzed</text>
    </g>
    <!-- Pill 2: Open Source Tools -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#1e2438" stroke="#374151" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">⭐ Open-Source Star Ranked</text>
    </g>
    <!-- Pill 3: Privacy & Local STT -->
    <g transform="translate(250, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#1e2438" stroke="#374151" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">🔒 Privacy-First &amp; Local ASR</text>
    </g>
  </g>
</svg>
